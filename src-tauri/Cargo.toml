[package]
name = "gitpane"
version = "0.1.0"
description = "A focused, lightweight Git workspace"
authors = ["gitpane"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "gitpane_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
portable-pty = "0.9"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
